# Deploys the relay to Cloudflare and the web app to GitHub Pages on every push to main.
# Once deployed, both keep running on their own; this only runs again when you push.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      # Without a token the relay is left as-is and the site uses the RELAY_URL variable.
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - id: deploy
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: relay

  pages:
    needs: relay
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Point the web app at the relay
        env:
          # Set a RELAY_URL repository variable to use a custom domain instead.
          RELAY_URL: ${{ vars.RELAY_URL || needs.relay.outputs.url }}
        run: |
          test -n "$RELAY_URL" || { echo "No relay URL from the Cloudflare deploy"; exit 1; }
          printf 'export const RELAY_URL = %s;\n' "\"${RELAY_URL%/}\"" > client/config.js
          cat client/config.js
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build the web app for older browsers
        working-directory: client
        run: |
          npm ci
          npm run build
          rm -rf node_modules
      - name: Stamp this version on the page's files
        # Browsers keep saved copies of style.css and app.min.js. Asking for
        # them by version means a new page never runs with old code or styles.
        working-directory: client
        run: |
          v="${GITHUB_SHA::10}"
          sed -i -e "s#href=\"style.css\"#href=\"style.css?v=$v\"#" -e "s#src=\"app.min.js\"#src=\"app.min.js?v=$v\"#" index.html
          sed -i -e "s#\"style.css\", \"app.min.js\"#\"style.css?v=$v\", \"app.min.js?v=$v\"#" -e "s#freemessenger-v[0-9]*#freemessenger-$v#" sw.js
          grep -n "v=$v" index.html sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: client
      - id: pages
        uses: actions/deploy-pages@v4
